[project]
name = "brain"
version = "0.1.0"
description = "A local, multi-source memory that follows you across AI tools."
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
